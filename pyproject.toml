[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-sync"
version = "0.8.1"
description = "FHIR resource bundler and synchronization library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fhir.resources>=8.0.0",
    "dic-helper-toolkit>=0.9.10",
    "fhirpathpy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0"
]

[project.scripts]
fhirsync = "fhirsync.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "responses>=0.26"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import tests/support.py
pythonpath = ["tests"]

[tool.setuptools]
packages = ["fhirsync"]

# GitLab package registry configuration
[tool.uv.sources]
dic-helper-toolkit = { index = "gitlab" }

[[tool.uv.index]]
name = "gitlab"
url = "https://git.diz.med.uni-jena.de/api/v4/projects/354/packages/pypi/simple"
authenticate = "always"
explicit = true
