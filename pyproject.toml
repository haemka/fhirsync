[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-sync"
version = "0.10.2"
description = "FHIR resource bundler and synchronization library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fhir.resources>=8.0.0",
    "dic-helper-toolkit>=1.0.4",
    "fhirpathpy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
# Reading FHIR XML files (source type files)
xml = [
    "dic-helper-toolkit[xml]>=1.0.4"
]

[project.scripts]
fhirsync = "fhirsync.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "responses>=0.26"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import tests/support.py
pythonpath = ["tests"]

[tool.setuptools]
packages = ["fhirsync"]
