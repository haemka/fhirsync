[common]
## Path to a CA certificate file used in all SSL communications
ca_file=./ca.crt
## Enable or disable strict RFC5280 X.509 certificate checks (defaults to true)
#rfc5280 = true

[source]
## The base URLS (FHIR endpoint) of the source system
base_url=https://my-fhir-source/fhir
## Optional query parameter for offset paging, only needed if the source does not page the standard FHIR way
## (next links in search Bundles), e.g. _offset. Without it, only standard FHIR paging is used.
#next_param=_offset
## An optional username for the source FHIR endpoint
#username=MyUsername
## An optional password for the source FHIR endpoint
#password=P4SSW0RD
## An optional auth server URL for OAuth2.0
#auth_url=https://my-keycloak-server/auth
## An optional auth realm for OAuth2.0
#realm=MyRealm
## An optional client id for OAuth2.0
#client_id=MyClient
## An optional client secret for OAuth2.0
#client_secret=CL13NTS3CR3T
## Path to a CA certificate file used for source connections (Optional, defaults to ca_file in [common])
#ca_file=./ca.crt
## Enable or disable strict RFC5280 X.509 certificate checks for source connections
## (Optional, defaults to rfc5280 in [common])
#rfc5280 = true

## Examples for optional request parameters to add to each request
## Default search parameters
#request_params=_lastUpdated=ge2024
## Explicit search parameters for Patient searches. This is just an example. The last part of the parameter key defines the
## resource type. Any resource type can be given here.
#request_params_Patien=identifier=http://mycodesystem|123

[target]
## Defines the output mode (options are 'file' or 'server')
mode=file
## Defines the output directory for files in output mode 'file'
outdir=.\\out
## Defines the target FHIR endpoint  in output mode 'server'
# base_url = https://my-fhir-server/fhir
## An optional username for the target FHIR endpoint
#username=MyUsername
## An optional password for the target FHIR endpoint
#password=P4SSW0RD
## An optional auth server URL for OAuth2.0
#auth_url=https://my-keycloak-server/auth
## An optional auth realm for OAuth2.0
#realm=MyRealm
## An optional client id for OAuth2.0
#client_id=MyClient
## An optional client secret for OAuth2.0
#client_secret=CL13NTS3CR3T
## Path to a CA certificate file used for target connections (Optional, defaults to ca_file in [common])
#ca_file=./ca.crt
## Enable or disable strict RFC5280 X.509 certificate checks for target connections
## (Optional, defaults to rfc5280 in [common])
#rfc5280 = true

[bundling]
## Determines what type of Bundle should be produced
bundle_type=transaction
## Defines the amount of search results to include per Bundle, this is not the actual output Bundle size, as there are
## still referenced resources added. Safest size is 1, as it will include any resulting Resource and it's references,
## but this depends on the actual query and it's dependencies. For batch Bundles it may not make any difference at all.
bundle_size=1
## The default request method for each resource in the result bundles (Optional, defaults to put).
## Supported values are put, post and post:ifNoneExist (only create the resource if none with the same identifier
## exists on the target).
request_method=put
## Optional request method for resources of a specific type (overrides the default)
#request_method_Patient=post:ifNoneExist
## Setting how to build the request URL of put requests (Optional, defaults to identifier). Post requests always use
## the resource type as URL. Supported values:
## - identifier: leads to a request URL like Patient?identifier=http://mycodesystem|123 where 123 is the identifier
## - id: leads to a request URL like Patient/123 where 123 is the id
request_url=identifier
## Optional request URL setting for resources of a specific type (overrides the default)
#request_url_Patient=id
## Optional comma separated list of referenced Resource types to not include into the Bundle
# ignore_references=Patient
## This setting determines how references between the resources are built.
## Options:
## - as_is: Don't change the references.
## - identifier: Rewrite the references to link to the identifier
## (Optional, defaults to identifier)
reference_mode=identifier
## Comma separated list of <ResourceType>=<system> pairs used in processing. Patient, Consent and ResearchStudy
## are required when processing gICS Consent resources.
identifier_systems=Patient=http://www.example-hospital.de/fhir/sid/patient,
    Consent=http://www.example-hospital.de/fhir/sid/consent,
    ResearchStudy=http://www.example-hospital.de/fhir/sid/researchstudy
## Identifier system of the produced Bundles
## (Optional, defaults to http://www.uniklinikum-jena.de/fhir/sid/consentBundle)
#bundle_identifier_system=http://www.example-hospital.de/fhir/sid/consentBundle
## Value written to meta.source of every bundled resource
## (Optional, defaults to http://www.uniklinikum-jena.de/fhir/origin/gics)
#meta_source=http://www.example-hospital.de/fhir/origin/gics

[notifications]
## Configures a notification MQTT endpoint
server = mymqtt-server
port = 8883
tls_enabled = true
## Path to a CA certificate file used for MQTT connections (Optional, defaults to ca_file in [common])
#ca_file=./ca.crt
## Enable or disable strict RFC5280 X.509 certificate checks for MQTT connections
## (Optional, defaults to rfc5280 in [common])
#rfc5280 = true
## The MQTT topic to subscribe
topic = ttp
## Optional username for the MQTT endpoint
#username = MyUsername
## Optional Password for the MQTT endpoint
#password = P4SSW0RD
