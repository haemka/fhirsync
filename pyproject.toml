[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-sync"
version = "0.10.4"
description = "Sync FHIR resources from a FHIR server or FHIR files to a FHIR server or files, as Bundles with configurable processing rules"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "haemka", email = "github@haemka.net" }]
maintainers = [{ name = "haemka", email = "github@haemka.net" }]
keywords = ["fhir", "hl7", "bundle", "sync", "fhirpath", "gics", "consent", "mii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fhir.resources>=8.0.0",
    "dic-helper-toolkit>=1.0.4",
    "fhirpathpy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
# Reading FHIR XML files (source type files)
xml = [
    "dic-helper-toolkit[xml]>=1.0.4"
]

[project.urls]
Repository = "https://github.com/haemka/fhirsync"
Issues = "https://github.com/haemka/fhirsync/issues"

[project.scripts]
fhirsync = "fhirsync.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "responses>=0.26"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import tests/support.py
pythonpath = ["tests"]

[tool.setuptools]
packages = ["fhirsync"]
